name: Deploy To Staging

on:
  push:
    branches: [ main ]
  

env:
  IMAGE_REPO: fadi7ay/nextflix

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Apply Image Optimization Fix ---
      - name: Apply Next.js image fix 🔧
        run: |
          cat > next.config.js <<'EOF'
          module.exports = {
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
            images: {
              unoptimized: true,
              disableStaticImages: true,
            },
          };
          EOF
          echo "✅ Applied image optimization fix"

      # --- CI Phase: Build & Push to Docker Hub ---
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set staging tag
        id: set_tag
        run: |
          echo "STAGING_TAG=staging-pr-${{ github.event.pull_request.number }}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build & push image (staging) 📦
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.STAGING_TAG }}
            ${{ env.IMAGE_REPO }}:staging-latest
      
      # --- CD Phase: Deploy to Staging EC2 ---
      - name: Deploy to Staging (SSH) 🚀
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # Create directory and deploy script if not exists
            mkdir -p ~/nextflix
            cd ~/nextflix
            
            # Create deploy script
            cat > deploy.sh <<'DEPLOY_SCRIPT'
            #!/bin/bash
            set -e
            IMAGE_TAG="${1}"
            PORT="${2:-3000}"
            TMDB_API_KEY="${3}"
            CONTAINER_NAME="nextflix"
            
            if [ -z "$IMAGE_TAG" ] || [ -z "$TMDB_API_KEY" ]; then
                echo "❌ Error: Missing required arguments"
                exit 1
            fi
            
            echo "🚀 Deploying $IMAGE_TAG..."
            docker pull "$IMAGE_TAG"
            
            if [ "$(docker ps -aq -f name=$CONTAINER_NAME)" ]; then
                echo "🛑 Stopping existing container..."
                docker stop $CONTAINER_NAME || true
                echo "🗑️  Removing existing container..."
                docker rm $CONTAINER_NAME || true
            fi
            
            echo "▶️  Starting new container..."
            docker run -d \
                --name $CONTAINER_NAME \
                --restart unless-stopped \
                -p $PORT:3000 \
                -e TMDB_API_KEY="$TMDB_API_KEY" \
                -e NODE_ENV=production \
                "$IMAGE_TAG"
            
            echo "⏳ Waiting for container to start..."
            sleep 5
            
            if [ "$(docker ps -q -f name=$CONTAINER_NAME)" ]; then
                echo "✅ Deployment successful!"
                echo "🌐 Application running at http://localhost:$PORT"
                echo ""
                echo "📋 Recent logs:"
                docker logs --tail 10 $CONTAINER_NAME
            else
                echo "❌ Deployment failed!"
                echo "📋 Container logs:"
                docker logs $CONTAINER_NAME
                exit 1
            fi
            
            # Cleanup old images (keep last 3)
            echo ""
            echo "🧹 Cleaning up old images..."
            docker images --format "{{.Repository}}:{{.Tag}} {{.ID}}" | \
                grep "fadi7ay/nextflix" | \
                tail -n +4 | \
                awk '{print $2}' | \
                xargs -r docker rmi || true
            DEPLOY_SCRIPT
            
            chmod +x deploy.sh
            
            # Execute deployment
            ./deploy.sh \
              '${{ env.IMAGE_REPO }}:${{ env.STAGING_TAG }}' \
              3000 \
              '${{ secrets.TMDB_API_KEY }}'
              
      # --- Notification Phase ---
      - name: Slack notify (staging) 📢
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": ":rocket: *NextFlix Staging Deployment*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *NextFlix Staging Deployment*\n*PR:* #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}\n*Tag:* `${{ env.STAGING_TAG }}`\n*Host:* ${{ secrets.STAGING_HOST }}\n*Status:* ${{ job.status }}\n*Author:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View PR"
                      },
                      "url": "${{ github.event.pull_request.html_url }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Logs"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}