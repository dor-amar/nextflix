name: Deploy To Production

on:
  push:
    branches: [ main ] # Runs after merge or direct push to main

env:
  IMAGE_REPO: fadi7ay/nextflix

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    # Prevents simultaneous production deploys
    concurrency: prod-deploy 
    
    steps:
      - name: Checkout repository (To access deploy.sh)
        uses: actions/checkout@v4

      # --- Tagging & Auth ---
      # Set version tags based on the main branch SHA for history/rollback
      - name: Set Production Tags
        id: set_tags
        run: |
          echo "PROD_SHA_TAG=prod-${{ github.sha }}" >> $GITHUB_ENV
          echo "LATEST_TAG=latest" >> $GITHUB_ENV

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # --- CD Phase: Deploy to Production EC2 (Reuse Image) ---
    
      # to deploy the *previously built* image.
      - name: Deploy to Production (SSH) 🎉
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }} # Use prod-specific key
          script_stop: true
          script: |
            # 1. Login to Docker Hub on the remote EC2 instance
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            
            # 2. Pull the image tagged 'latest' (which should be the last successfully built image)
            LATEST_IMAGE='${{ env.IMAGE_REPO }}:${{ env.LATEST_TAG }}'
            docker pull $LATEST_IMAGE
            
            # 3. Tag the pulled image with the specific SHA for versioning/rollback
            docker tag $LATEST_IMAGE ${{ env.IMAGE_REPO }}:${{ env.PROD_SHA_TAG }}

            # 4. Execute the deploy script.
            # Args: $1=IMAGE_TAG, $2=PORT, $3=TMDB_API_KEY
            cd ~/nextflix
            ./deploy.sh \
              $LATEST_IMAGE \
              3000 \
              '${{ secrets.TMDB_API_KEY }}' 

      # --- Notification Phase ---
      - name: Slack notify (production) 
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text":":tada: *NextFlix* deployed to *production*\nTags: ${{ env.PROD_SHA_TAG }}, latest\nHost: ${{ secrets.PROD_HOST }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}