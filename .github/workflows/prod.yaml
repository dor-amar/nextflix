name: Deploy To Production

on:
  push:
    branches: [ main ]

env:
  IMAGE_REPO: fadi7ay/nextflix

jobs:
  build-and-deploy-prod:
    runs-on: ubuntu-latest
    concurrency: prod-deploy         # prevents overlapping prod deploys
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (prod + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:prod-${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          

      - name: Deploy to production (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          envs: TMDB_API_KEY,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            cd ~/nextflix
            export TMDB_API_KEY='${{ secrets.TMDB_API_KEY }}'
            # if your Docker Hub repo is private, ensure deploy.sh logs in using the passed creds
            # echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            ./deploy.sh '${{ env.IMAGE_REPO }}:prod-${{ github.sha }}' 3000

      - name: Slack notify (production)
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text":":tada: *NextFlix* deployed to *production*\nTags: prod-${{ github.sha }}, latest\nHost: ${{ secrets.PROD_HOST }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
